name: Build MINICRAFT SURVIVAL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap add ios || true
          npx cap sync ios

      - name: Pod install
        run: |
          sudo gem install cocoapods
          cd ios/App && pod install --repo-update

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Package IPA
        run: |
          cd ios/App
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r MINICRAFT-SURVIVAL.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MINICRAFT-SURVIVAL-ipa
          path: ios/App/MINICRAFT-SURVIVAL.ipa
